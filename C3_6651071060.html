<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 3</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        table {
            border-collapse: collapse;
        }

        td {
            padding: 10px;
        }
    </style>
</head>

<body>

<table id="sampleTable" border="1">

    <tr>
        <td>Row1 cell1</td>
        <td>Row1 cell2</td>
    </tr>

    <tr>
        <td>Row2 cell1</td>
        <td>Row2 cell2</td>
    </tr>

</table>

<br>

<input type="button" id="insertRow" value="Insert Row">

<script>
$(document).ready(function() {

    $("#insertRow").click(function() {

        $("#sampleTable").append(
            "<tr>" +
            "<td>New cell1</td>" +
            "<td>New cell2</td>" +
            "</tr>"
        );

    });

});
</script>

</body>
</html>
