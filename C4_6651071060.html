<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 4</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<select id="colorSelect">
    <option>Red</option>
    <option>Green</option>
    <option>White</option>
    <option>Black</option>
</select>

<input
    type="button"
    id="removeColor"
    value="Select and Remove"
>

<script>
$(document).ready(function() {

    $("#removeColor").click(function() {

        $("#colorSelect option:selected").remove();

    });

});
</script>

</body>
</html>
