<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 2</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<form id="form1">

    First name:
    <input type="text" id="fname" value="David">

    <br><br>

    Last name:
    <input type="text" id="lname" value="Beckham">

    <br><br>

    <input type="submit" value="Submit">

</form>

<script>
$(document).ready(function() {

    $("#form1").submit(function(event) {

        event.preventDefault();

        var fname = $("#fname").val();
        var lname = $("#lname").val();

        alert(fname + " " + lname);

    });

});
</script>

</body>
</html>
