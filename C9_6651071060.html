<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 9</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form-box {
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .row {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
        }

        input {
            width: 280px;
            padding: 8px;
            box-sizing: border-box;
        }

        .button {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            margin: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

    </style>
</head>

<body>

<div class="form-box">

    <h2>ĐĂNG KÝ THÔNG TIN</h2>

    <form id="registerForm">

        <div class="row">

            <label>Họ tên *</label>

            <input
                type="text"
                id="fullname"
            >

        </div>


        <div class="row">

            <label>Email *</label>

            <input
                type="text"
                id="email"
            >

        </div>


        <div class="row">

            <label>Ngày sinh *</label>

            <input
                type="text"
                id="birthday"
                placeholder="mm/dd/yyyy"
            >

        </div>


        <div class="row">

            <label>Zip code *</label>

            <input
                type="text"
                id="zipcode"
                maxlength="5"
            >

        </div>


        <div class="row">

            <label>Địa chỉ</label>

            <input
                type="text"
                id="address"
            >

        </div>


        <div class="button">

            <button type="button" id="clear">
                Clear
            </button>

            <button type="submit">
                Finish
            </button>

        </div>

    </form>


    <div id="result"></div>

</div>


<script>

$(document).ready(function() {

    $("#clear").click(function() {

        $("#registerForm")[0].reset();

        $("#result").html("");

    });

    $("#registerForm").submit(function(event) {

        event.preventDefault();

        var loi = "";

        var hoTen = $("#fullname").val().trim();

        if (hoTen == "") {

            loi += "Họ tên không được để trống.<br>";

        }

        var email = $("#email").val().trim();

        var emailRegex =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

        if (email == "") {

            loi += "Email không được để trống.<br>";

        }
        else if (!emailRegex.test(email)) {

            loi += "Email không đúng định dạng.<br>";

        }

        var ngaySinh = $("#birthday").val().trim();

        var dateRegex =
            /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/;

        var ketQuaNgay =
            ngaySinh.match(dateRegex);


        if (ngaySinh == "") {

            loi += "Ngày sinh không được để trống.<br>";

        }
        else if (ketQuaNgay == null) {

            loi +=
                "Ngày sinh phải có dạng mm/dd/yyyy hoặc mm-dd-yyyy.<br>";

        }
        else {

            var thang = Number(ketQuaNgay[1]);
            var ngay = Number(ketQuaNgay[2]);
            var nam = Number(ketQuaNgay[3]);

            var namHienTai =
                new Date().getFullYear();

            if (thang < 1 || thang > 12) {

                loi +=
                    "Tháng phải từ 1 đến 12.<br>";

            }

            if (nam >= namHienTai) {

                loi +=
                    "Năm sinh phải nhỏ hơn năm hiện tại.<br>";

            }

            var ngayHopLe =
                new Date(nam, thang - 1, ngay);

            if (
                ngayHopLe.getFullYear() != nam ||
                ngayHopLe.getMonth() != thang - 1 ||
                ngayHopLe.getDate() != ngay
            ) {

                loi += "Ngày sinh không hợp lệ.<br>";

            }

        }

        var zip = $("#zipcode").val().trim();

        var zipRegex = /^\d{5}$/;


        if (zip == "") {

            loi +=
                "Zip code không được để trống.<br>";

        }
        else if (!zipRegex.test(zip)) {

            loi +=
                "Zip code phải có đúng 5 số.<br>";

        }

        if (loi != "") {

            $("#result")
                .removeClass("success")
                .addClass("error")
                .html(loi);

        }
        else {

            $("#result")
                .removeClass("error")
                .addClass("success")
                .html(
                    "Đăng ký thành công!"
                );

        }

    });

});

</script>

</body>
</html>
