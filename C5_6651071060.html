<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 5</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            margin-top: 30px;
        }

        #imageArea {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<button id="showImage">
    Show Image
</button>

<div id="imageArea"></div>

<script>
$(document).ready(function() {

    $("#showImage").click(function() {

        var images = [

            {
                src: "https://farm4.staticflickr.com/3691/11268502654_f28f05966c_m.jpg",
                width: 240,
                height: 160
            },

            {
                src: "https://farm1.staticflickr.com/33/45336904_1aef569b30_n.jpg",
                width: 320,
                height: 195
            },

            {
                src: "https://farm6.staticflickr.com/5211/5384592886_80a512e2c9.jpg",
                width: 500,
                height: 343
            }

        ];

        var randomIndex =
            Math.floor(Math.random() * images.length);

        var image = images[randomIndex];

        var img = $("<img>");

        img.attr("src", image.src);
        img.attr("width", image.width);
        img.attr("height", image.height);

        $("#imageArea").empty();
        $("#imageArea").append(img);

    });

});
</script>

</body>
</html>
